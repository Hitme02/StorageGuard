[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storageguard"
version = "0.1.0"
description = "StorageGuard: blast-radius-aware guardrails for LLM agents that administer enterprise storage, plus StorageAgentBench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "networkx>=3.2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "openai>=1.40",
    "diskcache>=5.6",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "jinja2>=3.1"]  # jinja2: chat-template test
mcp = ["mcp>=1.2"]

[project.scripts]
sg = "storageguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/storageguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["ollama: needs a local Ollama server (deselected by default)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]  # generated by scripts/make_colab_notebook.py

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP007"]
